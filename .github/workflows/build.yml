
name: Build Wind Blower JAR

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for Minecraft 26.3 + Fabric
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Verify generated JAR
        shell: bash
        run: |
          ls -la build/libs
          test -f build/libs/windblower-26.3-1.2.0.jar
          jar tf build/libs/windblower-26.3-1.2.0.jar >/dev/null
          echo "JAR archive verified. This does not replace an in-game test."

      - name: Upload the JAR
        uses: actions/upload-artifact@v7
        with:
          path: build/libs/windblower-26.3-1.2.0.jar
          archive: false
          if-no-files-found: error
          retention-days: 14
